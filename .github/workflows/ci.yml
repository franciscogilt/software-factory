name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @factory/web typecheck
      - run: pnpm --filter @factory/web lint
      - run: pnpm --filter @factory/web test
      - run: pnpm --filter @factory/db typecheck
      - run: pnpm --filter @factory/db test
  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f apps/web/Dockerfile -t factory-web:ci .
          docker build -f packages/db/Dockerfile -t factory-migrate:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name web -p 3000:3000 -e DATABASE_URL=postgres://x factory-web:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/api/health/live && exit 0
            sleep 2
          done
          docker logs web
          exit 1
  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @factory/web build
      - run: pnpm --filter @factory/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @factory/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results
