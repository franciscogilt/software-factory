name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @factory/web typecheck
      - run: pnpm --filter @factory/web lint
      - run: pnpm --filter @factory/web test
      - run: pnpm --filter @factory/db typecheck
      - run: pnpm --filter @factory/db test
  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f apps/web/Dockerfile -t factory-web:ci .
          docker build -f packages/db/Dockerfile -t factory-migrate:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name web -p 3000:3000 -e DATABASE_URL=postgres://x factory-web:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/api/health/live && exit 0
            sleep 2
          done
          docker logs web
          exit 1
