name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly: new advisories appear without any new commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    # Known vulnerabilities in production dependencies. High and critical block; the rest is reported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Block high and critical vulnerabilities
        run: pnpm audit --prod --audit-level=high
      - name: Report everything else
        run: pnpm audit --prod --audit-level=low || true
      - name: Licenses
        run: node scripts/check-licenses.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --verbose

  images:
    # Vulnerabilities with a fix available in the built images, plus the software inventory (SBOM).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f apps/web/Dockerfile -t factory-web:scan .
          docker build -f packages/db/Dockerfile -t factory-migrate:scan .
          docker build -f packages/jobs/Dockerfile -t factory-worker:scan .
          docker build -f infra/backup/Dockerfile -t factory-backup:scan .
      - name: Scan images
        run: |
          mkdir -p sbom
          failed=0
          for image in web migrate worker backup; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" aquasec/trivy:0.57.1 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress factory-$image:scan || failed=1
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" aquasec/trivy:0.57.1 \
              image --format cyclonedx --output /sbom/$image.cdx.json --no-progress factory-$image:scan
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom
