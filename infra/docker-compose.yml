# Local development mirror of production structure: app, PostgreSQL, test mailbox.
services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://factory:factory@db:5432/factory
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
volumes:
  dbdata:
