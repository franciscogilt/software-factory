# Local development mirror of production structure: app, PostgreSQL, test mailbox.
services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://factory:factory@db:5432/factory
      AUTH_SECRET: dev-only-change-me
      MFA_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZXMta2V5LWNoYW5nZS1tZSE=
      EMAIL_SERVER: smtp://mail:1025
      EMAIL_FROM: Factory <no-reply@example.test>
    depends_on:
      db:
        condition: service_healthy
      worker:
    build:
      context: ..
      dockerfile: packages/jobs/Dockerfile
    environment:
      DATABASE_URL: postgres://factory:factory@db:5432/factory
      EMAIL_SERVER: smtp://mail:1025
      EMAIL_FROM: Factory <no-reply@example.test>
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
        condition: service_completed_successfully
  migrate:
    # Migrations run as their own job before the app starts, never inside the app process.
    build:
      context: ..
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://factory:factory@db:5432/factory
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
volumes:
  dbdata:
