# Copia este archivo como product.config.yaml en la raíz de cada producto.
# Solo el dueño confirma estos valores; los agentes no asumen los que falten.
name: ""
type: saas            # saas | custom
validation: pending   # pending | approved (SaaS propio: el dueño aprueba nicho y MVP antes del primer ticket)
origin: new           # new | existing (existing exige completar la incorporación antes del primer ticket)
stack: default        # default | custom (requiere ADR)
work_tracker: github  # github | azure-devops | jira | factory-panel
repo_host: github     # github | azure-devops
ci: github-actions    # github-actions | azure-pipelines
cloud: none           # none (Docker Compose, sin nube de pago) | aws | azure | gcp
region: ""
market: do
payments: [azul, stripe]
data_kind: personal   # normal | personal | sensitive
branding: own         # own | white-label
autonomy: low-first   # nivel inicial de autonomía de agentes
budget:
  cost_per_task_usd: 0
  time_per_task_minutes: 0
critical_flows: [signup, login, payment, main-flow]
modules: []           # módulos opcionales del catálogo
